<div id="iv-picker-overlay" class="iv-modal-overlay" style="display:none">
    <div class="iv-modal iv-picker-box">
        <div class="iv-modal-header iv-picker-header">
            <span style="display:flex;align-items:center;gap:8px;color:var(--iv-accent)">${I.pick}<span style="color:var(--iv-text);font-size:13px;font-weight:600">Pick Context Messages</span></span>
            <div class="iv-picker-header-actions">
                <span class="iv-picker-count" id="iv-picker-count">0 selected</span>
                <button class="iv-action-btn" id="iv-picker-all">All</button>
                <button class="iv-action-btn" id="iv-picker-invert">Invert</button>
                <button class="iv-hbtn iv-hbtn-close" id="iv-picker-close">${I.x}</button>
            </div>
        </div>
        <div class="iv-picker-hint">Shift+Click: Range · Ctrl: Same Sender · Alt: Opposite Sender · Selection sets Ctx depth</div>
        <div class="iv-modal-body iv-picker-body" id="iv-picker-body"></div>
        <div class="iv-modal-footer" style="justify-content:space-between;gap:8px">
            <button class="iv-action-btn" id="iv-picker-clear">Clear Selection</button>
            <button class="iv-action-btn iv-picker-apply-btn" id="iv-picker-apply">${I.check} Apply</button>
        </div>
    </div>
</div>
